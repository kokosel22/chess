name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, rules tests and Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 (cloud runner only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2 (cloud runner only)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK (cloud runner only)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install cloud SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chess-coach-debug-key-v1
      - name: Create debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Restore compiled engine
        id: engine-cache
        uses: actions/cache/restore@v4
        with:
          key: stockfish-17.1-ndk27-v2
          path: |
            app/src/main/jniLibs/
            app/src/main/assets/
            .cloud/stockfish-source.tar.gz
            .cloud/BUILD-STOCKFISH.sh
      - name: Compile bundled Stockfish ARM64 and emulator engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare-stockfish.sh
      - name: Cache compiled engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: stockfish-17.1-ndk27-v2
          path: |
            app/src/main/jniLibs/
            app/src/main/assets/
            .cloud/stockfish-source.tar.gz
            .cloud/BUILD-STOCKFISH.sh
      - name: Rules tests, lint and installable APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare installation bundle
        run: |
          mkdir -p .cloud/delivery
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk .cloud/delivery/ChessCoachOverlay-arm64-debug.apk
          cp INSTALL-RU.md .cloud/delivery/
          cp THIRD-PARTY.md .cloud/delivery/
          cp .cloud/stockfish-source.tar.gz .cloud/delivery/
          cp .cloud/BUILD-STOCKFISH.sh .cloud/delivery/
          git archive --format=tar.gz -o .cloud/delivery/chess-coach-source.tar.gz HEAD
          sha256sum .cloud/delivery/ChessCoachOverlay-arm64-debug.apk > .cloud/delivery/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose .cloud/delivery/ChessCoachOverlay-arm64-debug.apk
      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessCoachOverlay-Redmi12-debug
          path: .cloud/delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Enable KVM on cloud runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
            adb pull /sdcard/Android/data/ru.chesscoach.overlay/files/ .cloud/screenshots/
      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            .cloud/screenshots/
          retention-days: 14
          if-no-files-found: warn
